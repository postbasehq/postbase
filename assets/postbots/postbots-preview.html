<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Postbots — all brand colours</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f7f5f0; --ink: #282722; --quiet: #827e75; --line: #ddd9d0;
      --brand-red: #d14a3e; --brand-blue: #2b59d9; --brand-yellow: #e3a72c;
      --brand-white: #ffffff; --brand-near-black: #202124;
      --white-stage: var(--brand-near-black); --black-stage: transparent; --light-stage: #f8f9fa;
      --space-small: 8px; --space-medium: 20px; --space-large: 40px;
      --edge: clamp(24px, 5vw, 72px); --character-size: min(300px, 100%);
      --title-size: clamp(32px, 5vw, 54px); --body-size: 14px; --label-size: 11px;
      --control-radius: 999px; --control-font: 13px; --focus-offset: 4px;
      --rule-width: 1px; --tracking: -0.055em; --label-tracking: 0.1em;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
    main { min-height: 100svh; padding: var(--edge); display: flex; flex-direction: column; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-medium); }
    h1 { margin: 0; font-size: var(--title-size); font-weight: 650; letter-spacing: var(--tracking); }
    .label, figcaption { font-size: var(--label-size); letter-spacing: var(--label-tracking); text-transform: uppercase; color: var(--quiet); }
    .state-picker { display: flex; gap: var(--space-small); margin-top: var(--space-medium); flex-wrap: wrap; }
    .state-picker button { font: inherit; font-size: var(--control-font); cursor: pointer; color: var(--quiet); background: transparent; border: var(--rule-width) solid var(--line); border-radius: var(--control-radius); padding: var(--space-small) var(--space-medium); }
    .state-picker button[aria-pressed="true"] { color: var(--canvas); background: var(--ink); border-color: var(--ink); }
    .state-picker button:focus-visible { outline: var(--rule-width) solid var(--ink); outline-offset: var(--focus-offset); }
    .stage { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-content: center; gap: var(--space-large) var(--space-medium); padding: var(--space-large) 0; }
    figure { margin: 0; display: grid; justify-items: center; gap: var(--space-small); }
    .character { width: var(--character-size); aspect-ratio: 390 / 270; }
    footer { border-top: var(--rule-width) solid var(--line); padding-top: var(--space-medium); }
    p { margin: 0; font-size: var(--body-size); color: var(--quiet); }
    .postbot-red { --bot-body: var(--brand-red); }
    .postbot-blue { --bot-body: var(--brand-blue); }
    .postbot-yellow { --bot-body: var(--brand-yellow); }
    .postbot-white { --bot-body: var(--brand-white); }
    .postbot-near-black { --bot-body: var(--brand-near-black); }
    /* Contrast surfaces belong only to the preview; the SVG files stay transparent. */
    .white-preview .character { background: var(--white-stage); }
    .black-preview .character { background: var(--black-stage); }
    figcaption { text-align: center; }
    @media (max-width: 700px) { .stage { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 520px) { .stage { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (prefers-color-scheme: dark) { :root { --white-stage: transparent; --black-stage: var(--light-stage); --canvas: #191917; --ink: #f7f5f0; --quiet: #9b978d; --line: #35352f; } }


    /* Separate face and eye groups let glances and blinks run independently. */
    :root {
      --bot-body: #d14a3e;
      --bot-mask-solid: #fff;
      --bot-mask-hole: #000;
      --bot-lift: -9px;
      --bot-hop: -17px;
      --bot-lean: -6deg;
      --bot-glance: 7px;
      --bot-glance-back: -7px;
      --bot-face-lift: -5px;
      --bot-eye-width: 26px;
      --bot-eye-height: 46px;
      --bot-eye-radius: 13px;
      --bot-far-eye-width: 19px;
      --bot-far-eye-height: 37px;
      --bot-far-eye-radius: 9.5px;
      --bot-eye-angle: -28deg;
      --bot-body-pivot: 150px 193px;
      --bot-eye-pivot: 83px 74px;
      --bot-idle-speed: 2.8s;
      --bot-blink-speed: 5.2s;
      --bot-face-speed: 7.6s;
      --bot-thought-lift: -12px;
      --bot-scan-left: -8px;
      --bot-scan-right: 8px;
      --bot-focus-speed: 1.8s;
      --bot-hover-speed: 0.6s;
      --bot-ease: cubic-bezier(.45, 0, .25, 1);
    }
    .postbot-inverted { --bot-body-pivot: 203px 193px; }
    .postbot { color: var(--bot-body); cursor: pointer; }
    .body { animation: bob var(--bot-idle-speed) var(--bot-ease) infinite; transform-origin: var(--bot-body-pivot); }
    .face { animation: glance var(--bot-face-speed) var(--bot-ease) infinite; }
    .eyes { animation: blink var(--bot-blink-speed) infinite; transform-origin: var(--bot-eye-pivot); }
    .mask-base { fill: var(--bot-mask-solid); }
    .eye-mask { mask-type: luminance; }
    .eye { fill: var(--bot-mask-hole); width: var(--bot-eye-width); height: var(--bot-eye-height); rx: var(--bot-eye-radius); }
    /* The farther eye is smaller and higher, suggesting a face turned in space. */
    .eye-angle { transform: rotate(var(--bot-eye-angle)); transform-box: fill-box; transform-origin: center; }
    .eye-far { width: var(--bot-far-eye-width); height: var(--bot-far-eye-height); rx: var(--bot-far-eye-radius); }
    .postbot[data-state="resting"]:hover .body { animation: hello var(--bot-hover-speed) var(--bot-ease) infinite alternate; }
    .postbot[data-state="resting"]:hover .face { animation: none; transform: translateY(var(--bot-face-lift)); }
    .postbot[data-state="resting"]:hover .eyes { animation: blink var(--bot-blink-speed) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(var(--bot-lift)); } }
    @keyframes blink { 0%, 42%, 46%, 100% { transform: scaleY(1); } 44% { transform: scaleY(.08); } }
    @keyframes glance { 0%, 18%, 48%, 68%, 100% { transform: translate(0, 0); } 26%, 40% { transform: translate(var(--bot-glance), var(--bot-face-lift)); } 76%, 88% { transform: translateX(var(--bot-glance-back)); } }
    @keyframes hello { from { transform: translateY(var(--bot-lift)) rotate(0deg); } to { transform: translateY(var(--bot-hop)) rotate(var(--bot-lean)); } }
    /* State changes affect the mask's eye shapes, preserving real transparency. */
    .postbot[data-state="resting"] { --bot-face-speed: 12s; --bot-blink-speed: 6.8s; }
    .postbot[data-state="thinking"] { --bot-lift: -4px; --bot-face-speed: 3.8s; }
    .postbot[data-state="thinking"] .face { animation-name: ponder; transform: translateY(var(--bot-thought-lift)); }
    .postbot[data-state="thinking"] .eye-far { animation: question var(--bot-face-speed) var(--bot-ease) infinite; transform-box: fill-box; transform-origin: center; }
    .postbot[data-state="working"] { --bot-lift: -3px; --bot-face-speed: 2.4s; }
    .postbot[data-state="working"] .face { animation-name: scan; }
    .postbot[data-state="working"] .eyes { animation: focus var(--bot-focus-speed) var(--bot-ease) infinite; transform: scaleY(.76); }
    @keyframes ponder { 0%, 100% { transform: translate(0, 0); } 20%, 65% { transform: translate(var(--bot-glance), var(--bot-thought-lift)); } 80% { transform: translateY(var(--bot-face-lift)); } }
    @keyframes question { 0%, 100% { transform: scaleY(1); } 20%, 65% { transform: scaleY(.62); } 80% { transform: scaleY(1.12); } }
    @keyframes scan { 0%, 100% { transform: translateX(var(--bot-scan-left)); } 35%, 55% { transform: translateX(var(--bot-scan-right)); } 75% { transform: translate(0, var(--bot-face-lift)); } }
    @keyframes focus { 0%, 100% { transform: scaleY(.76); } 35%, 65% { transform: scaleY(.96); } 46%, 53% { transform: scaleY(.12); } 49% { transform: scaleY(.78); } }
    @media (prefers-reduced-motion: reduce) {
      .postbot .body, .postbot .face, .postbot .eyes, .postbot .eye-far { animation: none !important; }
    }
  
  </style>
</head>
<body>
  <main>
    <header><h1>Postbots.</h1><span class="label">Brand colour collection</span></header>
    <div class="state-picker" role="group" aria-label="Postbot face state">
      <button type="button" data-face="resting" aria-pressed="true">Resting</button>
      <button type="button" data-face="thinking" aria-pressed="false">Thinking</button>
      <button type="button" data-face="working" aria-pressed="false">Working</button>
    </div>
    <!-- Unique mask IDs let all ten transparent faces animate independently. -->
    <div class="stage">

      <figure><svg class="character" xmlns="http://www.w3.org/2000/svg" viewBox="-45 -35 390 270" role="img" aria-labelledby="postbot-upright-blue-title"><title id="postbot-upright-blue-title">Postbot — the Postbase P brought to life</title><g class="postbot postbot-blue" data-state="resting"><g class="body"><!-- Animated eye shapes remove opacity, revealing any background beneath. --><defs><mask id="postbot-upright-blue-eye-mask" class="eye-mask" maskUnits="userSpaceOnUse" x="-45" y="-35" width="390" height="270"><rect class="mask-base" x="-45" y="-35" width="390" height="270" /><g transform="translate(8 16)"><g class="face"><g class="eyes"><g class="eye-angle"><rect class="eye" x="51" y="57" /></g><g class="eye-angle"><rect class="eye eye-far" x="92" y="45.5" /></g></g></g></g></mask></defs><g mask="url(#postbot-upright-blue-eye-mask)"><path fill="currentColor" d="M10 0H270Q278 0 278 8C274 58 249 88 214 88C180 88 150 64 150 32V118A75 75 0 0 1 0 118V10Q0 0 10 0Z" /></g></g></g></svg><figcaption>Blue / upright</figcaption></figure>

      <figure class="white-preview"><svg class="character" xmlns="http://www.w3.org/2000/svg" viewBox="-45 -35 390 270" role="img" aria-labelledby="postbot-upright-white-title"><title id="postbot-upright-white-title">Postbot — the Postbase P brought to life</title><g class="postbot postbot-white" data-state="resting"><g class="body"><!-- Animated eye shapes remove opacity, revealing any background beneath. --><defs><mask id="postbot-upright-white-eye-mask" class="eye-mask" maskUnits="userSpaceOnUse" x="-45" y="-35" width="390" height="270"><rect class="mask-base" x="-45" y="-35" width="390" height="270" /><g transform="translate(8 16)"><g class="face"><g class="eyes"><g class="eye-angle"><rect class="eye" x="51" y="57" /></g><g class="eye-angle"><rect class="eye eye-far" x="92" y="45.5" /></g></g></g></g></mask></defs><g mask="url(#postbot-upright-white-eye-mask)"><path fill="currentColor" d="M10 0H270Q278 0 278 8C274 58 249 88 214 88C180 88 150 64 150 32V118A75 75 0 0 1 0 118V10Q0 0 10 0Z" /></g></g></g></svg><figcaption>White / upright</figcaption></figure>
      <figure class="black-preview"><svg class="character" xmlns="http://www.w3.org/2000/svg" viewBox="-45 -35 390 270" role="img" aria-labelledby="postbot-upright-near-black-title"><title id="postbot-upright-near-black-title">Postbot — the Postbase P brought to life</title><g class="postbot postbot-near-black" data-state="resting"><g class="body"><!-- Animated eye shapes remove opacity, revealing any background beneath. --><defs><mask id="postbot-upright-near-black-eye-mask" class="eye-mask" maskUnits="userSpaceOnUse" x="-45" y="-35" width="390" height="270"><rect class="mask-base" x="-45" y="-35" width="390" height="270" /><g transform="translate(8 16)"><g class="face"><g class="eyes"><g class="eye-angle"><rect class="eye" x="51" y="57" /></g><g class="eye-angle"><rect class="eye eye-far" x="92" y="45.5" /></g></g></g></g></mask></defs><g mask="url(#postbot-upright-near-black-eye-mask)"><path fill="currentColor" d="M10 0H270Q278 0 278 8C274 58 249 88 214 88C180 88 150 64 150 32V118A75 75 0 0 1 0 118V10Q0 0 10 0Z" /></g></g></g></svg><figcaption>Near Black / upright</figcaption></figure>
      <figure><svg class="character" xmlns="http://www.w3.org/2000/svg" viewBox="-45 -35 390 270" role="img" aria-labelledby="postbot-upside-down-red-title"><title id="postbot-upside-down-red-title">Postbot — upside-down P</title><g class="postbot postbot-red postbot-inverted" data-state="resting"><g class="body"><!-- Animated eye shapes remove opacity, revealing any background beneath. --><defs><mask id="postbot-upside-down-red-eye-mask" class="eye-mask" maskUnits="userSpaceOnUse" x="-45" y="-35" width="390" height="270"><rect class="mask-base" x="-45" y="-35" width="390" height="270" /><g transform="translate(128 0)"><g class="face"><g class="eyes"><g class="eye-angle"><rect class="eye" x="51" y="57" /></g><g class="eye-angle"><rect class="eye eye-far" x="92" y="45.5" /></g></g></g></g></mask></defs><g mask="url(#postbot-upside-down-red-eye-mask)"><path transform="rotate(180 139 96.5)" fill="currentColor" d="M10 0H270Q278 0 278 8C274 58 249 88 214 88C180 88 150 64 150 32V118A75 75 0 0 1 0 118V10Q0 0 10 0Z" /></g></g></g></svg><figcaption>Red / upside down</figcaption></figure>

      <figure><svg class="character" xmlns="http://www.w3.org/2000/svg" viewBox="-45 -35 390 270" role="img" aria-labelledby="postbot-upside-down-yellow-title"><title id="postbot-upside-down-yellow-title">Postbot — upside-down P</title><g class="postbot postbot-yellow postbot-inverted" data-state="resting"><g class="body"><!-- Animated eye shapes remove opacity, revealing any background beneath. --><defs><mask id="postbot-upside-down-yellow-eye-mask" class="eye-mask" maskUnits="userSpaceOnUse" x="-45" y="-35" width="390" height="270"><rect class="mask-base" x="-45" y="-35" width="390" height="270" /><g transform="translate(128 0)"><g class="face"><g class="eyes"><g class="eye-angle"><rect class="eye" x="51" y="57" /></g><g class="eye-angle"><rect class="eye eye-far" x="92" y="45.5" /></g></g></g></g></mask></defs><g mask="url(#postbot-upside-down-yellow-eye-mask)"><path transform="rotate(180 139 96.5)" fill="currentColor" d="M10 0H270Q278 0 278 8C274 58 249 88 214 88C180 88 150 64 150 32V118A75 75 0 0 1 0 118V10Q0 0 10 0Z" /></g></g></g></svg><figcaption>Yellow / upside down</figcaption></figure>
      <figure class="white-preview"><svg class="character" xmlns="http://www.w3.org/2000/svg" viewBox="-45 -35 390 270" role="img" aria-labelledby="postbot-upside-down-white-title"><title id="postbot-upside-down-white-title">Postbot — upside-down P</title><g class="postbot postbot-white postbot-inverted" data-state="resting"><g class="body"><!-- Animated eye shapes remove opacity, revealing any background beneath. --><defs><mask id="postbot-upside-down-white-eye-mask" class="eye-mask" maskUnits="userSpaceOnUse" x="-45" y="-35" width="390" height="270"><rect class="mask-base" x="-45" y="-35" width="390" height="270" /><g transform="translate(128 0)"><g class="face"><g class="eyes"><g class="eye-angle"><rect class="eye" x="51" y="57" /></g><g class="eye-angle"><rect class="eye eye-far" x="92" y="45.5" /></g></g></g></g></mask></defs><g mask="url(#postbot-upside-down-white-eye-mask)"><path transform="rotate(180 139 96.5)" fill="currentColor" d="M10 0H270Q278 0 278 8C274 58 249 88 214 88C180 88 150 64 150 32V118A75 75 0 0 1 0 118V10Q0 0 10 0Z" /></g></g></g></svg><figcaption>White / upside down</figcaption></figure>
      <figure class="black-preview"><svg class="character" xmlns="http://www.w3.org/2000/svg" viewBox="-45 -35 390 270" role="img" aria-labelledby="postbot-upside-down-near-black-title"><title id="postbot-upside-down-near-black-title">Postbot — upside-down P</title><g class="postbot postbot-near-black postbot-inverted" data-state="resting"><g class="body"><!-- Animated eye shapes remove opacity, revealing any background beneath. --><defs><mask id="postbot-upside-down-near-black-eye-mask" class="eye-mask" maskUnits="userSpaceOnUse" x="-45" y="-35" width="390" height="270"><rect class="mask-base" x="-45" y="-35" width="390" height="270" /><g transform="translate(128 0)"><g class="face"><g class="eyes"><g class="eye-angle"><rect class="eye" x="51" y="57" /></g><g class="eye-angle"><rect class="eye eye-far" x="92" y="45.5" /></g></g></g></g></mask></defs><g mask="url(#postbot-upside-down-near-black-eye-mask)"><path transform="rotate(180 139 96.5)" fill="currentColor" d="M10 0H270Q278 0 278 8C274 58 249 88 214 88C180 88 150 64 150 32V118A75 75 0 0 1 0 118V10Q0 0 10 0Z" /></g></g></g></svg><figcaption>Near Black / upside down</figcaption></figure>
    </div>
    <footer><p id="state-caption" aria-live="polite">Resting · ready for a task.</p></footer>
  </main>
  <script>
    // State is the only input; the SVG handles its expression and motion with CSS.
    const captions = { resting: 'Resting · ready for a task.', thinking: 'Thinking · figuring out the next step.', working: 'Working · focused on the task.' };
    document.querySelectorAll('[data-face]').forEach(button => {
      button.addEventListener('click', () => {
        const state = button.dataset.face;
        if (!Object.hasOwn(captions, state)) return;
        document.querySelectorAll('.postbot').forEach(bot => { bot.dataset.state = state; });
        document.querySelectorAll('[data-face]').forEach(control => { control.setAttribute('aria-pressed', String(control === button)); });
        document.getElementById('state-caption').textContent = captions[state];
      });
    });
  </script>
</body>
</html>
